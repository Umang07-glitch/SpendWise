# Demo deployment. Free Postgres expires after 30 days; export data before expiry.
services:
  - type: web
    name: spendwise
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: spendwise-db
          property: connectionString
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_DAYS
        value: "7"
      - key: PORT
        value: "10000"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
databases:
  - name: spendwise-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: spendwise
    user: spendwise
    ipAllowList: []
