name: SpendWise checks
on: [push, pull_request]
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spendwise
          POSTGRES_PASSWORD: spendwise
          POSTGRES_DB: spendwise
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U spendwise" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://spendwise:spendwise@localhost:5432/spendwise
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -q
        working-directory: backend
      - run: alembic upgrade head && alembic check && python -m app.seed
        working-directory: backend
      - run: npm ci && npm run typecheck && npm run build
        working-directory: frontend
      - name: Full-stack HTTP smoke check
        run: |
          (cd backend && python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/spendwise-api.log 2>&1) &
          (cd frontend && npm start > /tmp/spendwise-web.log 2>&1) &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health && curl -fsS http://localhost:3000 > /dev/null; then break; fi
            sleep 2
          done
          python scripts/smoke.py
